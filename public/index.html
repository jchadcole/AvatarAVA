<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booth avatar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="staff-corner" aria-hidden="true"></div>
    <span id="sandbox" hidden>Sandbox: sessions end after about a minute</span>

    <!-- Portrait kiosk: configurable header, the avatar, and the live transcript over its lower part. -->
    <main id="kiosk">
      <header id="masthead">
        <div id="logo">
          <img id="logo-image" alt="" hidden />
          <span id="logo-text" hidden></span>
        </div>
        <h1 id="headline"></h1>
        <p id="subtitle" hidden></p>
      </header>

      <section id="stage">
        <div id="avatar-frame">
          <video id="avatar" autoplay playsinline></video>
        </div>

        <aside id="panel">
          <section id="attract" hidden>
            <p id="attract-sub"></p>
            <button id="start">Start</button>
            <p id="attract-status" role="status"></p>
          </section>

          <section id="visit">
            <div id="captions" aria-live="polite"></div>
            <div id="controls">
              <button id="talk" aria-label="Hold to talk">
                <span class="dot"></span>
              </button>
              <p id="status"></p>
              <canvas id="wave" aria-hidden="true"></canvas>
            </div>
            <div id="suggestions"></div>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
